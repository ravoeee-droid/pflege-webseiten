<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#102b33"><title>HKA Schall · Pflege zuhause in Rösrath</title><style>html,body{margin:0;background:#fbfaf6;color:#17333a;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}</style></head><body><div class="loading" id="loading"><div><strong>HKA Schall</strong><br>Vorschau wird geladen…</div></div><script>(async()=>{try{if(!('DecompressionStream' in window))throw new Error('unsupported');const files=['/chunks/c0.txt','/chunks/c1.txt','/chunks/c2.txt'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('loading').innerHTML='<div><h1>HKA Schall</h1><p>Die Vorschau konnte in diesem Browser nicht geladen werden.</p><p>Bitte Chrome, Safari oder Edge verwenden.</p></div>'}})();</script></body></html>
